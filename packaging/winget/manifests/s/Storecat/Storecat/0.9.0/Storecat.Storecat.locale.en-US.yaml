ShortDescription: Catalogue every drive you own and search it offline, even when the drive is unplugged.
Description: |-
  Storecat records every file on your external drives, NAS shares and folders: names, paths,
  sizes, dates, metadata, thumbnails and document text. Search all of it instantly whether
  the drive is connected or not, find duplicates across drives, run verified backup-and-move
  jobs, and get suggestions for what should live on fast storage and what belongs on an
  archive disk. Everything stays on your computer.
