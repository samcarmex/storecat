[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/platform",
    "crates/extract",
    "crates/cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.9.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/samcarmex/storecat"
authors = ["Storecat contributors"]

[workspace.dependencies]
storecat-core = { path = "crates/core" }
storecat-platform = { path = "crates/platform" }
storecat-extract = { path = "crates/extract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"

# Small, fast binaries: the app is opened many times a day.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
