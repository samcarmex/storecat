[package]
name = "storecat-extract"
description = "Metadata, thumbnail and text extraction for Storecat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
flate2 = "1.1.11"
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff", "ico"] }
kamadak-exif = "0.6.2"
lofty = "0.24.0"
log = "0.4.35"
lopdf = "0.42.0"
mail-parser = "0.11.9"
matroska = "0.30.1"
mp4 = "0.14.0"
pdf-extract = "0.12.1"
quick-xml = "0.41.0"
serde.workspace = true
serde_json.workspace = true
sevenz-rust = "0.6.1"
tar = "0.4.46"
thiserror.workspace = true
time = "0.3.45"
zip = "7.3.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
]}

[dev-dependencies]
tempfile = "3.27.0"
